version: 3.8

services:
  - type: web
    name: my-app
    env: node
    buildCommand: npm install
    startCommand: npm start
    plan: free
    region: oregon
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
    healthCheckPath: /
    routes:
      - src: /
        dest: /index.html
